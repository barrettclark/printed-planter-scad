name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scad-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          openscad --version

      - name: Run test suite
        run: |
          # GitHub Actions runs bash steps as `bash -e {0}` by default, which
          # would abort this script the moment any openscad invocation exits
          # nonzero (expected behavior for both the assertion-failure tests
          # and the wall-thickness invariant's empty-STL check below) before
          # its output can be inspected. Disable that here.
          set +e
          fail=0

          # Tests expected to succeed cleanly (exit 0, no ERROR in output).
          for f in tests/test_insert.scad \
                   tests/test_body.scad \
                   tests/test_base.scad \
                   tests/test_bosl2_texture_smoke.scad \
                   tests/test_decoration.scad \
                   tests/test_decoration_ridges.scad \
                   tests/test_decoration_pattern_types.scad \
                   tests/test_planter_integration.scad; do
            echo "=== $f (expect clean) ==="
            out=$(openscad -o /tmp/ci_$(basename "$f" .scad).csg "$f" 2>&1)
            code=$?
            echo "$out"
            if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR"; then
              echo "FAIL: $f (exit $code, or ERROR in output)"
              fail=1
            fi
          done

          # Full-assembly variants: the default-only invocation above never
          # exercises the custom outer-mode path (translation/containment
          # asserts) or the drainage-hole subtraction path in planter() --
          # both have had real regressions before. -D overrides the
          # Customizer defaults for these dedicated checks.
          echo "=== tests/test_planter_integration.scad (custom_outer_mode, expect clean) ==="
          out=$(openscad -D 'outer_mode="custom"' -o /tmp/ci_variant_custom_outer_mode.csg tests/test_planter_integration.scad 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR"; then
            echo "FAIL: full-assembly variant custom_outer_mode (exit $code, or ERROR in output)"
            fail=1
          fi

          echo "=== tests/test_planter_integration.scad (drainage_enabled, expect clean) ==="
          out=$(openscad -D 'drainage_holes_enabled=true' -o /tmp/ci_variant_drainage_enabled.csg tests/test_planter_integration.scad 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR"; then
            echo "FAIL: full-assembly variant drainage_enabled (exit $code, or ERROR in output)"
            fail=1
          fi

          # test_decoration_pattern_types.scad only calls decorated_solid()
          # directly -- it never exercises the full planter() assembly, so a
          # texture that breaks only in that context (e.g. via the peak-aware
          # cone extrapolation in planter.scad) would still pass CI. Render
          # each new pattern_type through the real assembly too.
          for pt in diamonds hex_grid pyramids bricks checkers dots cubes tri_grid; do
            for relief in raised etched; do
              echo "=== tests/test_planter_integration.scad (pattern_type=$pt, relief_mode=$relief, expect clean) ==="
              out=$(openscad -D "pattern_type=\"$pt\"" -D "relief_mode=\"$relief\"" -o /tmp/ci_variant_${pt}_${relief}.csg tests/test_planter_integration.scad 2>&1)
              code=$?
              echo "$out"
              if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR"; then
                echo "FAIL: full-assembly variant pattern_type=$pt relief_mode=$relief (exit $code, or ERROR in output)"
                fail=1
              fi
            done
          done

          # Wall-thickness invariant: must render EMPTY (cavity never pokes
          # through the outer wall) for all 3 documented parameter combos.
          # .csg export does not force full CGAL evaluation (a non-empty
          # difference() would still "succeed" with no ERROR), so this uses
          # .stl output, which does force evaluation. A truly empty result
          # makes OpenSCAD refuse to write the STL and exit nonzero -- that
          # nonzero exit is EXPECTED here; the actual pass signal is the
          # "Current top level object is empty." sentinel string.
          for combo in 0 1 2; do
            echo "=== tests/test_wall_thickness_invariant.scad combo=$combo (expect empty) ==="
            out=$(openscad -D "combo=$combo" -o /tmp/ci_wall_thickness_$combo.stl tests/test_wall_thickness_invariant.scad 2>&1)
            echo "$out"
            if ! echo "$out" | grep -q "Current top level object is empty."; then
              echo "FAIL: wall thickness invariant combo=$combo (expected 'Current top level object is empty.')"
              fail=1
            fi
          done

          # Tests expected to fail their internal assertion (ERROR is success here).
          for f in tests/test_body_custom_assert.scad \
                   tests/test_decoration_depth_assert.scad; do
            echo "=== $f (expect ERROR: Assertion failed) ==="
            out=$(openscad -o /tmp/ci_$(basename "$f" .scad).csg "$f" 2>&1)
            echo "$out"
            if ! echo "$out" | grep -q "ERROR: Assertion"; then
              echo "FAIL: $f (expected an assertion failure, got none)"
              fail=1
            fi
          done

          # Invalid pattern_type: check not just that an assertion fires, but
          # that its message actually names the valid options -- a regression
          # that dropped the pattern list from the message would otherwise
          # still pass a generic "ERROR: Assertion" check.
          echo "=== tests/test_decoration_invalid_pattern_type.scad (expect specific message) ==="
          out=$(openscad -o /tmp/ci_test_decoration_invalid_pattern_type.csg tests/test_decoration_invalid_pattern_type.scad 2>&1)
          echo "$out"
          if ! echo "$out" | grep -q "pattern_type must be one of"; then
            echo "FAIL: invalid pattern_type assertion is missing the expected message prefix"
            fail=1
          fi
          for pt in none ridges diamonds hex_grid pyramids bricks checkers dots cubes tri_grid; do
            if ! echo "$out" | grep -q "\"$pt\""; then
              echo "FAIL: invalid pattern_type assertion message is missing \"$pt\""
              fail=1
            fi
          done

          exit $fail
