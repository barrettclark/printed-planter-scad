name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scad-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          openscad --version

      - name: Run test suite
        run: |
          # GitHub Actions runs bash steps as `bash -e {0}` by default, which
          # would abort this script the moment any openscad invocation exits
          # nonzero (expected behavior for both the assertion-failure tests
          # and the wall-thickness invariant's empty-STL check below) before
          # its output can be inspected. Disable that here.
          set +e
          fail=0

          # Tests expected to succeed cleanly (exit 0, no ERROR in output).
          # These are compile checks only -- .csg does not evaluate geometry.
          # For test_decoration_pattern_types.scad (one side-by-side solid per
          # pattern_type, 20 of them) .csg is not a preference, it is
          # required: exporting that file to .stl would union all of them
          # through CGAL, and unioning the "teardrop" solid with another
          # textured solid aborts CGAL outright
          # on OpenSCAD 2021.01 (see modules/decoration.scad). Even before
          # "teardrop" existed the union measured 5+ minutes because of
          # "bricks". Real manifold validation for every pattern lives in the
          # full-assembly loop further down, which does a genuine difference()
          # one pattern at a time.
          for f in tests/test_insert.scad \
                   tests/test_body.scad \
                   tests/test_base.scad \
                   tests/test_bosl2_texture_smoke.scad \
                   tests/test_decoration.scad \
                   tests/test_decoration_ridges.scad \
                   tests/test_decoration_tile_aspect.scad \
                   tests/test_decoration_pattern_types.scad \
                   tests/test_decoration_etched_groove.scad \
                   tests/test_planter_integration.scad; do
            echo "=== $f (expect clean) ==="
            out=$(openscad -o /tmp/ci_$(basename "$f" .scad).csg "$f" 2>&1)
            code=$?
            echo "$out"
            if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR" || echo "$out" | grep -q "CGAL error"; then
              echo "FAIL: $f (exit $code, or ERROR/CGAL error in output)"
              fail=1
            fi
          done

          # These ten pattern_types are built from hand-rolled VNF tiles
          # rather than BOSL2 texture names, so each gets its own .stl
          # (CGAL-forcing) check on top of the loops below -- those files also
          # assert the tile shape invariants (unit cube footprint, VNF not
          # string, no style override, and the twin-vertex rule that makes the
          # tile stitch to its own repeats). One file per tile, not one shared
          # file: "teardrop" cannot be union()ed with any other textured solid
          # without aborting CGAL on OpenSCAD 2021.01. The three "kis"-family
          # patterns (tetrakis_square/kisrhombille/triakis_triangular) share
          # that same one-file-per-tile structure even though they measured
          # CGAL-safe -- consistency with the other hand-rolled tiles, not a
          # sign of fragility.
          for f in teardrop tumbling_cubes intertwine islamic_star \
                   tetrakis_square kisrhombille triakis_triangular rhombille \
                   cairo_pentagonal floret_pentagonal; do
            echo "=== tests/test_decoration_$f.scad (expect clean) ==="
            out=$(openscad -o /tmp/ci_test_decoration_$f.stl tests/test_decoration_$f.scad 2>&1)
            code=$?
            echo "$out"
            if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR" || echo "$out" | grep -q "CGAL error"; then
              echo "FAIL: tests/test_decoration_$f.scad (exit $code, or ERROR/CGAL error in output)"
              fail=1
            fi
          done

          # Build every texture individually (one solid at a time, no
          # union/difference), which is cheap even for "bricks", without
          # test_decoration_pattern_types.scad's impractically slow
          # all-in-one-file cost above. Both relief modes are covered since
          # "dots" takes a different (negative-tex_depth) code path when
          # etched -- that path had no coverage anywhere until this loop.
          # Caveat: exporting a single top-level object to .stl does not push
          # it through CGAL in OpenSCAD 2021.01, so this loop proves the VNF
          # builds, not that it is manifold; the full-assembly loop further
          # down (a real difference()) is what validates the mesh.
          for pt in none ridges diamonds hex_grid pyramids bricks checkers dots cubes tri_grid teardrop tumbling_cubes intertwine islamic_star tetrakis_square kisrhombille triakis_triangular rhombille cairo_pentagonal floret_pentagonal; do
            for relief in raised etched; do
              echo "=== decorated_solid pattern_type=$pt relief_mode=$relief (expect texture build to succeed) ==="
              printf 'include <%s/modules/decoration.scad>\ndecorated_solid("%s", "vertical", "%s", 1.5, 12, 75, 60, 100, 4);\n' "$(pwd)" "$pt" "$relief" > /tmp/ci_single_pattern.scad
              out=$(openscad -o /tmp/ci_single_${pt}_${relief}.stl /tmp/ci_single_pattern.scad 2>&1)
              code=$?
              echo "$out"
              if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR" || echo "$out" | grep -q "CGAL error"; then
                echo "FAIL: single-pattern texture build for pattern_type=$pt relief_mode=$relief (exit $code, or ERROR/CGAL error in output)"
                fail=1
              fi
            done
          done

          # Full-assembly variants: the default-only invocation above never
          # exercises the custom outer-mode path (translation/containment
          # asserts) or the drainage-hole subtraction path in planter() --
          # both have had real regressions before. -D overrides the
          # Customizer defaults for these dedicated checks.
          echo "=== tests/test_planter_integration.scad (custom_outer_mode, expect clean) ==="
          out=$(openscad -D 'outer_mode="custom"' -o /tmp/ci_variant_custom_outer_mode.stl tests/test_planter_integration.scad 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR" || echo "$out" | grep -q "CGAL error"; then
            echo "FAIL: full-assembly variant custom_outer_mode (exit $code, or ERROR/CGAL error in output)"
            fail=1
          fi

          echo "=== tests/test_planter_integration.scad (drainage_enabled, expect clean) ==="
          out=$(openscad -D 'drainage_holes_enabled=true' -o /tmp/ci_variant_drainage_enabled.stl tests/test_planter_integration.scad 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR" || echo "$out" | grep -q "CGAL error"; then
            echo "FAIL: full-assembly variant drainage_enabled (exit $code, or ERROR/CGAL error in output)"
            fail=1
          fi

          # Insert presets: one real full-assembly STL evaluation per named
          # preset, exercising insert_preset's override of insert_top_d/
          # insert_bottom_d/insert_height through the whole planter() build.
          for preset in small medium large; do
            echo "=== tests/test_planter_integration.scad (insert_preset=$preset, expect clean) ==="
            out=$(openscad -D "insert_preset=\"$preset\"" -o /tmp/ci_variant_preset_${preset}.stl tests/test_planter_integration.scad 2>&1)
            code=$?
            echo "$out"
            if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR" || echo "$out" | grep -q "CGAL error"; then
              echo "FAIL: full-assembly variant insert_preset=$preset (exit $code, or ERROR/CGAL error in output)"
              fail=1
            fi
          done

          # Insert preset RESOLUTION (not just error-free rendering): confirms
          # insert_preset's override actually reaches _resolved_insert_top_d/
          # _resolved_insert_bottom_d/_resolved_insert_height with the exact
          # documented values. The full-assembly loop above only proves the
          # geometry renders without error under each preset -- a regression
          # that dropped a ternary (e.g. _resolved_insert_top_d = insert_top_d;)
          # would still render a valid (just wrong) planter and pass that loop.
          for preset in small medium large; do
            echo "=== tests/test_insert_preset_resolved.scad (insert_preset=$preset, expect clean) ==="
            out=$(openscad -D "insert_preset=\"$preset\"" -o /tmp/ci_resolved_${preset}.csg tests/test_insert_preset_resolved.scad 2>&1)
            code=$?
            echo "$out"
            if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR" || echo "$out" | grep -q "CGAL error"; then
              echo "FAIL: insert_preset resolution check for insert_preset=$preset (exit $code, or ERROR/CGAL error in output)"
              fail=1
            fi
          done

          # "custom" case: passes explicit insert_top_d/insert_bottom_d/
          # insert_height that differ from both planter.scad's defaults
          # (150/110/130) and every named preset, so a regression that
          # resolved "custom" to the defaults or to a preset's values
          # (instead of passing these fields through unchanged) shows up as
          # a mismatch rather than passing by coincidence. Flagged by
          # Copilot review on PR #6: the original version of this loop only
          # covered the 3 named presets, never the "custom" branch.
          echo "=== tests/test_insert_preset_resolved.scad (insert_preset=custom, explicit dims, expect clean) ==="
          out=$(openscad -D 'insert_preset="custom"' -D 'insert_top_d=140' -D 'insert_bottom_d=90' -D 'insert_height=111' -o /tmp/ci_resolved_custom.csg tests/test_insert_preset_resolved.scad 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR" || echo "$out" | grep -q "CGAL error"; then
            echo "FAIL: insert_preset resolution check for insert_preset=custom (exit $code, or ERROR/CGAL error in output)"
            fail=1
          fi

          # Regression: some OpenSCAD Customizer builds store the dropdown's
          # whole "value:Label" string in insert_preset instead of just the
          # value (real-world deviation from documented Customizer behavior,
          # reported against this project). Confirms planter.scad's
          # _insert_preset_key normalization strips it back to "medium".
          echo "=== tests/test_insert_preset_resolved.scad (insert_preset with Customizer label suffix, expect clean) ==="
          out=$(openscad -D 'insert_preset="medium:Medium (130x120 / 100mm bottom)"' -o /tmp/ci_resolved_medium_labeled.csg tests/test_insert_preset_resolved.scad 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR" || echo "$out" | grep -q "CGAL error"; then
            echo "FAIL: insert_preset resolution check for insert_preset with Customizer label suffix (exit $code, or ERROR/CGAL error in output)"
            fail=1
          fi

          # test_decoration_pattern_types.scad only calls decorated_solid()
          # directly -- it never exercises the full planter() assembly, so a
          # texture that breaks only in that context (e.g. via the peak-aware
          # cone extrapolation in planter.scad, or the difference() against
          # the cavity not staying a valid manifold) would still pass CI.
          # Render each new pattern_type through the real assembly too, with
          # real .stl evaluation.
          #
          # Reduced pattern_repeat (4, 8, 9, 12, or 13, not the default 16) and
          # smoothness (24, not 60) specifically for this check: at default
          # settings, "bricks" alone measured 2-3+ minutes PER combination for a full
          # difference() against the cavity (its randomized per-facet
          # roughness multiplies out badly), which made real evaluation of
          # all 36 combinations impractically slow. At these reduced
          # settings the same "bricks" check measured ~15s and everything
          # else under 5s -- fewer facets to evaluate, same code paths
          # exercised, so this still catches a self-intersecting or
          # degenerate result from any texture/relief combination.
          #
          # "islamic_star", "tumbling_cubes" and "intertwine" don't get the
          # shared reps=4 value: all three build their motif from a few large
          # flat plateaus, and BOSL2 lays a single FLAT facet across each one,
          # so a plateau spanning a wide arc has a chord that cuts back inside
          # the wall and aborts the cavity subtraction in CGAL. The square-tile
          # fix (deriving vertical_reps from real geometry instead of reusing
          # pattern_repeat) changed each pattern's tile shape enough to move
          # these thresholds. Re-measured at smoothness=24 IN BOTH RELIEF
          # MODES -- "clean" below always means clean in both "raised" and
          # "etched", since a value clean in only one mode is not safe to
          # ship: "islamic_star" fails in at least one mode at 3, 4, 5, 7, 11,
          # 12 (6 and 9 are raised-only, 7 is etched-only); 8 and 10 are the
          # only values clean in both, so this uses the smaller, 8.
          # "tumbling_cubes" fails in at least one mode everywhere from 3
          # through 8, at 11, and at 12 (12 is raised-only -- it aborts in
          # etched); only 9 and 10 are clean in both, so this uses the
          # smaller, 9. "intertwine" fails in both modes at 4 and 6, and in
          # etched only at 7; 3, 5, 8, 12 and 15 are all clean in both modes
          # locally -- see the note below on why this uses 12, not the
          # smallest. None of this is a clean
          # cutoff in either parameter or predictable from a single relief
          # mode, so these are the specific values measured clean in both
          # relief modes, not values believed safe by rule. README.md
          # documents the limitation; the defaults are covered separately
          # after this loop.
          #
          # "intertwine"'s value is 12, not the smallest locally-clean value
          # (3): 3 passed on a local macOS OpenSCAD build but CGAL-aborted on
          # this workflow's Ubuntu build, both reporting OpenSCAD 2021.01 --
          # the same known CGAL floating-point sensitivity this whole
          # fragility problem stems from also varies by platform, not just by
          # pattern_repeat/smoothness. 12 was chosen with a tested safety
          # margin either side (10 aborts in etched mode; 15 is also clean in
          # both) rather than picking the next-smallest value and repeating
          # the same mistake. If this ever aborts on CI again, re-measure
          # directly against a CI run, not just a local build -- local-clean
          # is necessary but not sufficient here.
          #
          # "tetrakis_square", "kisrhombille" and "triakis_triangular" (the
          # "kis"-family patterns) DO get the shared reps=4 value: unlike the
          # three plateau patterns above, they're built from many small
          # triangular fan facets (via _kis_shrunk_fan()), not a few large
          # flat islands, so there's no wide-arc chord to cut back inside the
          # wall. Measured clean in both relief modes at pattern_repeat=4 AND
          # at the shipped defaults (pattern_repeat=16, smoothness=60) during
          # each pattern's own implementation task, then re-verified directly
          # against this workflow's actual GitHub Actions run (not just
          # locally) -- see the intertwine note above for why that
          # distinction matters on this runner.
          #
          # "rhombille" does NOT get the shared reps=4 value either, and does
          # NOT share the "kis" family's reasoning above: it reuses
          # tumbling_cubes' own hexagon/rhombus geometry directly (the same
          # large flat plateaus, just one uniform height instead of three),
          # so it has the exact same wide-arc-chord failure mode as
          # tumbling_cubes/islamic_star/intertwine, not the kis family's
          # small-triangle-facet safety. Measured locally first, then
          # re-verified directly against this workflow's real GitHub Actions
          # run (Ubuntu run 35477972837: both relief modes at
          # pattern_repeat=13/smoothness=24 rendered a clean 2-volume STL,
          # under the "CGAL error" check this workflow now also greps for) --
          # see the intertwine note above for why that distinction matters.
          # At smoothness=24, aborts in at least one relief mode at
          # pattern_repeat 4, 6, 8, 9 (etched only), 11 and 14 (raised only);
          # 7, 10, 12, 13 and 15 are clean in both modes. 13 is used rather
          # than the smallest (7): 7 is a single clean value sandwiched
          # between two full aborts (6 and 8) with no tested margin, exactly
          # what burned "intertwine" above; 13 has a clean neighbor on one
          # side (12) and only a partial failure on the other (14, raised-only
          # abort). If this check ever fails on the real CI run, re-measure
          # directly against it rather than trusting the local value further.
          #
          # "cairo_pentagonal" does NOT get the shared reps=4 value either --
          # despite being built from small-ish pentagons, it tiles 8 flat
          # plateau islands per unit tile and measured the same wide-arc-chord
          # fragility as the plateau patterns above, not the kis family's
          # safety. Measured locally (macOS OpenSCAD 2021.01) over
          # pattern_repeat 3-16 at smoothness=24 in both relief modes: aborts
          # in both modes at 3, 5, 10 and 11, and in "etched" only at 4;
          # 6, 7, 8, 9, 12, 13, 14, 15 and 16 are clean in both modes.
          # This uses 8, which is not an isolated clean value: it sits in the
          # middle of a four-wide run (6, 7, 8, 9) all measured clean in BOTH
          # relief modes, so it has a tested margin on each side -- the exact
          # property "intertwine"'s 3 and "rhombille"'s 7 lacked. Not yet
          # re-verified against this workflow's real Ubuntu run (local-clean
          # is necessary but not sufficient here, per the intertwine note
          # above); if this check fails on CI, re-measure against the CI run
          # and pick another value from the clean run, not the next smallest.
          #
          # "floret_pentagonal" is the most CGAL-fragile pattern in the file:
          # 18 flat pentagon plateaus per unit tile (vs. cairo_pentagonal's 8),
          # so it gets its own value too. Measured locally (macOS OpenSCAD
          # 2021.01) over pattern_repeat 3-16 at smoothness=24 in both relief
          # modes: "raised" aborts at 3, 7, 8 and 12; "etched" aborts at 3, 4,
          # 7, 8, 10, 12 and 13. Clean in BOTH modes at 5, 6, 9, 11, 14, 15
          # and 16. This uses 15, the only value in that range with a
          # tested-clean neighbor on each side in both modes (14 and 16) --
          # 5, 6, 9 and 11 are all adjacent to an abort on at least one side,
          # so picking one of them would repeat the isolated-clean-value
          # mistake "intertwine"'s 3 made. Not yet re-verified against this
          # workflow's real Ubuntu run; if this check fails on CI, re-measure
          # against the CI run rather than nudging the value locally.
          run_assembly_combo() {
            pt="$1"; relief="$2"; reps="$3"; smooth="${4:-24}"
            echo "=== tests/test_planter_integration.scad (pattern_type=$pt, relief_mode=$relief, pattern_repeat=$reps, smoothness=$smooth, expect real evaluation to succeed) ==="
            out=$(openscad -D "pattern_type=\"$pt\"" -D "relief_mode=\"$relief\"" -D "pattern_repeat=$reps" -D "smoothness=$smooth" -o /tmp/ci_variant_${pt}_${relief}_${reps}_${smooth}.stl tests/test_planter_integration.scad 2>&1)
            code=$?
            echo "$out"
            if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR" || echo "$out" | grep -q "CGAL error"; then
              echo "FAIL: full-assembly STL evaluation for pattern_type=$pt relief_mode=$relief pattern_repeat=$reps smoothness=$smooth (exit $code, or ERROR/CGAL error in output)"
              fail=1
            fi
          }
          for combo in "ridges 4" "diamonds 4" "hex_grid 4" "pyramids 4" "bricks 4" \
                       "checkers 4" "dots 4" "cubes 4" "tri_grid 4" "teardrop 4" \
                       "islamic_star 8" "tumbling_cubes 9" "intertwine 12" \
                       "tetrakis_square 4" "kisrhombille 4" "triakis_triangular 4" \
                       "rhombille 13" "cairo_pentagonal 8" "floret_pentagonal 15"; do
            set -- $combo
            for relief in raised etched; do
              run_assembly_combo "$1" "$relief" "$2"
            done
          done

          # The loop above dodges the CGAL fragility with measured-safe reduced
          # values, which means it never covers what a Customizer user actually
          # gets. The fragility depends on pattern_repeat and smoothness
          # JOINTLY -- tumbling_cubes at pattern_repeat=16 is clean at
          # smoothness 24, 40 and 60 but aborts at 80 and 100 -- so "clean at
          # the reduced values" says nothing about the defaults. This is also
          # why planter.scad's shipped smoothness default was lowered from 80
          # to 60 after the square-tile fix changed vertical_reps: 80 now
          # aborts CGAL for tumbling_cubes at the shipped pattern_repeat=16 in
          # both relief modes, and 60 is the highest smoothness confirmed
          # clean there. Pin the real defaults for islamic_star and
          # tumbling_cubes (measured ~1-2 min per relief mode each).
          # "intertwine" is deliberately NOT pinned here -- even though it now
          # renders faster at smoothness=60 (~2-3 minutes per relief mode,
          # versus ~7 minutes at the old smoothness=80 default) it would still
          # roughly double this job's runtime for one combination. README's
          # "clean for all three" claim covers intertwine based on manual
          # measurement, not CI; if intertwine's tile construction ever
          # changes, re-verify it manually rather than assuming CI would catch
          # a regression there.
          #
          # "rhombille" is pinned here too, unlike "intertwine": it renders
          # fast (a few seconds, not minutes -- it's tumbling_cubes' own
          # plateau geometry at one uniform height, with none of
          # intertwine's per-crossing strand construction), and was directly
          # measured clean at pattern_repeat=16/smoothness=60 in both relief
          # modes during this task (see README.md's CGAL section) -- higher
          # smoothness values (80, 100) were not tested for "rhombille" and
          # are not claimed clean.
          #
          # "cairo_pentagonal" is pinned here for the same reason as
          # "rhombille" -- it renders in well under a minute and its shipped
          # defaults were directly measured clean in both relief modes. This
          # pattern's smoothness axis WAS swept at pattern_repeat=16: clean in
          # both relief modes at smoothness 24, 40, 60 and 80, and aborting at
          # smoothness=100 in "etched" only (clean there in "raised"), which is
          # comfortably above the shipped 60 but is exactly why the default is
          # pinned rather than assumed.
          #
          # "floret_pentagonal" is pinned here too, and for this pattern the
          # pin is load-bearing rather than reassurance: it is the most
          # CGAL-fragile pattern in the file, and its implementation plan's
          # own smoke test (a bare cyl() with tex_reps=[12,8], not the planter
          # assembly) reported an abort at these very defaults in "raised".
          # The full local sweep of the real assembly disagrees -- at
          # pattern_repeat=16/smoothness=60 both relief modes measured clean,
          # with 14 and 15 clean on the low side in both modes too -- so the
          # shipped defaults are NOT knowingly broken. But that margin is
          # narrow (13 aborts in "etched", 12 aborts in both), and the finding
          # is macOS-only so far -- README.md's CGAL section separately
          # records smoothness 80 and 100 also measuring clean at this
          # pattern_repeat, locally, but likewise not yet CI-verified. This
          # pin is what turns "clean on the author's Mac" into a CI-enforced
          # claim.
          for relief in raised etched; do
            run_assembly_combo "islamic_star" "$relief" 16 60
            run_assembly_combo "tumbling_cubes" "$relief" 16 60
            run_assembly_combo "rhombille" "$relief" 16 60
            run_assembly_combo "cairo_pentagonal" "$relief" 16 60
            run_assembly_combo "floret_pentagonal" "$relief" 16 60
          done

          # README documents that "tumbling_cubes" and "islamic_star" union
          # cleanly with another textured solid, while "teardrop",
          # "intertwine", "rhombille" and "cairo_pentagonal" abort CGAL in
          # that case. Nothing enforced the clean
          # half of that claim: test_decoration_pattern_types.scad unions every
          # pattern but exports .csg, which never invokes CGAL. That gap is how
          # the claim came to be documented (wrongly) for "intertwine" in the
          # first place. Union with a "dots" solid, difference against a
          # disjoint cube to force real evaluation, ~100s each. pattern_repeat
          # is 9, not 8: the square-tile fix moved islamic_star's fragile
          # values on this geometry (r1=75, r2=60, height=100, fn=50) to 6-8,
          # so 9 is the smallest value re-measured clean for both patterns.
          for pt in tumbling_cubes islamic_star; do
            echo "=== union($pt, dots) differenced (expect clean CGAL union) ==="
            printf 'include <%s/modules/decoration.scad>\ndifference() {\n  union() {\n    decorated_solid("%s", "vertical", "raised", 1.5, 9, 75, 60, 100, 4);\n    translate([200, 0, 0]) decorated_solid("dots", "vertical", "raised", 1.5, 9, 75, 60, 100, 4);\n  }\n  translate([600, 0, 0]) cube(10, center = true);\n}\n' "$(pwd)" "$pt" > /tmp/ci_union_${pt}.scad
            out=$(openscad -o /tmp/ci_union_${pt}.stl /tmp/ci_union_${pt}.scad 2>&1)
            code=$?
            echo "$out"
            if [ $code -ne 0 ] || echo "$out" | grep -q "ERROR" || echo "$out" | grep -q "CGAL error"; then
              echo "FAIL: textured-solid union check for pattern_type=$pt (exit $code, or ERROR/CGAL error in output)"
              fail=1
            fi
          done

          # Wall-thickness invariant: must render EMPTY (cavity never pokes
          # through the outer wall) for all 3 documented parameter combos.
          # .csg export does not force full CGAL evaluation (a non-empty
          # difference() would still "succeed" with no ERROR), so this uses
          # .stl output, which does force evaluation. A truly empty result
          # makes OpenSCAD refuse to write the STL and exit nonzero -- that
          # nonzero exit is EXPECTED here; the actual pass signal is the
          # "Current top level object is empty." sentinel string.
          for combo in 0 1 2; do
            echo "=== tests/test_wall_thickness_invariant.scad combo=$combo (expect empty) ==="
            out=$(openscad -D "combo=$combo" -o /tmp/ci_wall_thickness_$combo.stl tests/test_wall_thickness_invariant.scad 2>&1)
            echo "$out"
            if ! echo "$out" | grep -q "Current top level object is empty."; then
              echo "FAIL: wall thickness invariant combo=$combo (expected 'Current top level object is empty.')"
              fail=1
            fi
          done

          # Geometry-level check that insert_cavity()'s actual rendered
          # boundary -- not just cavity_radius_at()'s numbers, which
          # tests/test_insert.scad already covers -- follows the ramp. The
          # module's own polygon could independently drift from the function
          # (e.g. a copy-paste error that left a stale breakpoint) and still
          # pass every purely numeric check. Same "must render empty" idiom
          # as the wall-thickness invariant above.
          for check in 0 1 2; do
            echo "=== tests/test_insert_cavity_ramp_geometry.scad check=$check (expect empty) ==="
            out=$(openscad -D "check=$check" -o /tmp/ci_ramp_geometry_$check.stl tests/test_insert_cavity_ramp_geometry.scad 2>&1)
            echo "$out"
            if ! echo "$out" | grep -q "Current top level object is empty."; then
              echo "FAIL: insert_cavity ramp geometry check=$check (expected 'Current top level object is empty.')"
              fail=1
            fi
          done

          # Tests expected to fail their internal assertion (ERROR is success here).
          for f in tests/test_body_custom_assert.scad \
                   tests/test_decoration_depth_assert.scad; do
            echo "=== $f (expect ERROR: Assertion failed) ==="
            out=$(openscad -o /tmp/ci_$(basename "$f" .scad).csg "$f" 2>&1)
            echo "$out"
            if ! echo "$out" | grep -q "ERROR: Assertion"; then
              echo "FAIL: $f (expected an assertion failure, got none)"
              fail=1
            fi
          done

          # ledge_ramp_height's bounds check lives in planter.scad as a
          # top-level assert, not inside a module -- pre-include variable
          # assignment can't override it (OpenSCAD flattens repeated
          # top-level assignments to the textually last one), so this has to
          # go through test_planter_integration.scad with -D, same as every
          # other planter.scad-level override in this file. Checks both
          # invalid boundaries (negative, and larger than
          # ledge_engagement_height) and the exact message, not just that
          # some assertion fired -- a regression that asserted the wrong
          # condition could still produce a generic "ERROR: Assertion".
          for bad in -1 9; do
            echo "=== tests/test_planter_integration.scad (ledge_ramp_height=$bad, expect specific message) ==="
            out=$(openscad -D "ledge_ramp_height=$bad" -o /tmp/ci_ledge_ramp_height_$bad.csg tests/test_planter_integration.scad 2>&1)
            echo "$out"
            if ! echo "$out" | grep -q "ERROR: Assertion"; then
              echo "FAIL: ledge_ramp_height=$bad did not actually fail an assertion"
              fail=1
            fi
            if ! echo "$out" | grep -q "ledge_ramp_height must be between 0 and ledge_engagement_height (8), got $bad"; then
              echo "FAIL: ledge_ramp_height=$bad assertion is missing the expected message"
              fail=1
            fi
          done

          # Invalid pattern_type: check not just that an assertion fires, but
          # that its message actually names the valid options -- a regression
          # that dropped the pattern list from the message would otherwise
          # still pass a generic "ERROR: Assertion" check.
          echo "=== tests/test_decoration_invalid_pattern_type.scad (expect specific message) ==="
          out=$(openscad -o /tmp/ci_test_decoration_invalid_pattern_type.csg tests/test_decoration_invalid_pattern_type.scad 2>&1)
          echo "$out"
          if ! echo "$out" | grep -q "ERROR: Assertion"; then
            echo "FAIL: invalid pattern_type did not actually fail an assertion"
            fail=1
          fi
          if ! echo "$out" | grep -q "pattern_type must be one of"; then
            echo "FAIL: invalid pattern_type assertion is missing the expected message prefix"
            fail=1
          fi
          for pt in none ridges diamonds hex_grid pyramids bricks checkers dots cubes tri_grid teardrop tumbling_cubes intertwine islamic_star tetrakis_square kisrhombille triakis_triangular rhombille cairo_pentagonal floret_pentagonal; do
            if ! echo "$out" | grep -q "\"$pt\""; then
              echo "FAIL: invalid pattern_type assertion message is missing \"$pt\""
              fail=1
            fi
          done

          # tests/test_insert_presets.scad asserts the 3 named presets'
          # dimensions match README.md's insert_preset table, then
          # deliberately triggers _insert_preset_dims("bogus") -- a wrong
          # dimension above would fail with a different assertion message,
          # so checking for this exact one still validates the earlier
          # asserts passed.
          echo "=== tests/test_insert_presets.scad (expect specific message) ==="
          out=$(openscad -o /tmp/ci_test_insert_presets.csg tests/test_insert_presets.scad 2>&1)
          echo "$out"
          if ! echo "$out" | grep -q "ERROR: Assertion"; then
            echo "FAIL: invalid insert_preset did not actually fail an assertion"
            fail=1
          fi
          if ! echo "$out" | grep -q 'insert_preset must be "custom" or one of \["small", "medium", "large"\], got "bogus"'; then
            echo "FAIL: invalid insert_preset assertion is missing the expected message"
            fail=1
          fi

          exit $fail
